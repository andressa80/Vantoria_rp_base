<script>
$(() => {
	let blocked = false
	let list = []
	let lastTitle = ""

	window.addEventListener("message",function(event){
		switch(event.data.action){
			case 'notify':
				addNotification(event.data.data)
			break

			case 'showAll':
				if (list.length > 0){
					showLast()
					$.post("http://vrp_notifycall/focusOn")
				}
			break

			case 'hideAll':
				hideAll()
				$.post("http://vrp_notifycall/focusOff")
			break
		}
	})

	document.onkeyup = function(data){
		if (data.which == 27){
			hideAll()
			$.post("http://vrp_notifycall/focusOff")
		}
	}

	$(document).on("click","#loc",function(){
		$.post("http://vrp_notifycall/setWay",JSON.stringify({
			x: $(this).data("x"),
			y: $(this).data("y")
		}))
	})

	$(document).on("click","#phone",function(){
		$.post("http://vrp_notifycall/phoneCall",JSON.stringify({
			phone: $(this).data("phone")
		}))
	})

	const hideAll = () => {
		blocked = false
		$(".body").css("overflow","hidden").html("")
	}

	const addNotification = data => {

		// 🔥 anti spam
		if (data.title === lastTitle) return
		lastTitle = data.title

		if (list.length > 9) list.shift()

		// 🔊 SOM NUI
		new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg").play()

		const html = `<div class="notification">
			<div class="content">
				${data.code ? `<div class="code">10-${data.code}</div>` : ""}
				<div class="titulo">${data.title}</div>

				${data.street ? `<div class="content-line">📍 ${data.street}</div>` : ""}
				${data.name ? `<div class="content-line">👤 ${data.name}</div>` : ""}
				${data.vehicle ? `<div class="content-line">🚗 ${data.vehicle}</div>` : ""}
				${data.time ? `<div class="content-line">⏰ ${data.time}</div>` : ""}
			</div>

			<div class="buttons">
				<div class="chamados" id="loc" data-x="${data.x}" data-y="${data.y}">📍</div>
				${data.phone ? `<div class="chamados" id="phone" data-phone="${data.phone}">📞</div>` : ""}
			</div>

			${data.text ? `<div class="texto">${data.text}</div>` : ""}
		</div>`

		list.push(html)

		if (!blocked){
			$(html).prependTo(".body")
			.hide()
			.fadeIn(200)
			.delay(5000)
			.fadeOut(200)
		}
	}

	const showLast = () => {
		hideAll()
		blocked = true

		$(".body").css("overflow-y","scroll")
		for (i in list){
			$(list[i]).prependTo(".body")
		}
	}
})
</script>
