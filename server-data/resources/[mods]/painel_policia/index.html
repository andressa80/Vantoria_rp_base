<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #050a14; --card: #0a192f; --gold: #c5a059; --silver: #cbd5e1; }
        body { font-family: 'Ubuntu', sans-serif; display: none; background: rgba(0,0,0,0.7); height: 100vh; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; color: white; }
        .mdt-container { width: 1200px; height: 800px; background: var(--bg); border: 2px solid var(--gold); border-radius: 5px; display: flex; box-shadow: 0 0 20px rgba(197, 160, 89, 0.2); }
        
        /* Sidebar */
        aside { width: 260px; background: #02060c; border-right: 1px solid var(--gold); padding: 20px; display: flex; flex-direction: column; }
        .profile-area { text-align: center; margin-bottom: 30px; border-bottom: 1px solid #1a2a4a; padding-bottom: 20px; }
        .profile-pic { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--gold); margin-bottom: 10px; }
        
        nav button { background: none; border: none; color: var(--silver); padding: 15px; text-align: left; cursor: pointer; width: 100%; transition: 0.3s; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        nav button:hover, nav button.active { background: var(--card); color: var(--gold); border-left: 4px solid var(--gold); }

        /* Main Content */
        main { flex: 1; padding: 40px; overflow-y: auto; background: url('https://i.imgur.com/vHqJ9Zt.png') no-repeat center; background-size: 40%; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 4px; border-top: 3px solid var(--gold); text-align: center; }
        .stat-card h2 { color: var(--gold); margin: 0; font-size: 28px; }

        /* Forms & Inputs */
        input, textarea { background: #112240; border: 1px solid #1d2d50; padding: 12px; color: white; border-radius: 4px; width: calc(100% - 26px); margin-bottom: 15px; }
        input:focus { border-color: var(--gold); outline: none; }
        .btn-action { background: var(--gold); color: black; border: none; padding: 12px 25px; cursor: pointer; font-weight: bold; border-radius: 3px; text-transform: uppercase; }
        
        .status-badge { padding: 4px 8px; border-radius: 3px; font-size: 10px; font-weight: bold; }
        .online { background: #22c55e; color: white; }
    </style>
</head>
<body>
    <div class="mdt-container">
        <aside>
            <div class="profile-area">
                <img src="https://i.imgur.com/8K6h0eX.png" class="profile-pic">
                <div id="off-name" style="font-weight: bold; color: var(--gold);">OFICIAL DINASTIA</div>
                <div id="off-rank" style="font-size: 11px; color: var(--silver);">CARREGANDO...</div>
            </div>
            <nav>
                <button class="active" onclick="openTab('dash')"><i class="fas fa-home"></i> Dashboard</button>
                <button onclick="openTab('search')"><i class="fas fa-search"></i> Consultar Cidadão</button>
                <button onclick="openTab('arrest')"><i class="fas fa-handcuffs"></i> Efetuar Prisão</button>
                <button onclick="openTab('dispatch')"><i class="fas fa-radio"></i> Central de Chamados</button>
                <button onclick="openTab('manage')"><i class="fas fa-users-cog"></i> Gestão de Equipe</button>
            </nav>
            <div style="margin-top: auto; font-size: 10px; color: var(--gold); text-align: center;">
                <i class="fas fa-shield-halved"></i> DINASTIA SYSTEM
            </div>
        </aside>

        <main>
            <!-- DASHBOARD -->
            <div id="tab-dash">
                <h1 style="border-bottom: 1px solid var(--gold); padding-bottom: 10px;">ESTATÍSTICAS DO DIA</h1>
                <div class="stats-grid">
                    <div class="stat-card"><h3>Prisões</h3><h2 id="stats-arrests">0</h2></div>
                    <div class="stat-card"><h3>Multas</h3><h2 id="stats-fines">0</h2></div>
                    <div class="stat-card"><h3>Apreensões</h3><h2 id="stats-items">0</h2></div>
                </div>
                <div class="card" style="background: var(--card); padding: 20px;">
                    <h3><i class="fas fa-users"></i> Oficiais em Serviço</h3>
                    <div id="officers-list">Aguardando dados...</div>
                </div>
            </div>

            <!-- BUSCA -->
            <div id="tab-search" style="display:none;">
                <h1>CONSULTA NACIONAL</h1>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="search-id" placeholder="Digite o ID do Cidadão...">
                    <button class="btn-action" style="height: 42px;" onclick="searchCitizen()">BUSCAR</button>
                </div>
                <div id="search-result" style="margin-top: 20px;"></div>
            </div>
        </main>
    </div>

    <script>
        function openTab(tab) {
            $("main > div").hide();
            $("#tab-" + tab).show();
            $("nav button").removeClass("active");
            $(event.currentTarget).addClass("active");
        }

        window.addEventListener('message', function(event) {
            let item = event.data;
            if (item.action === "open") {
                $("body").fadeIn();
                $("#off-name").text(item.name);
                $("#off-rank").text(item.rank);
            }
            if (item.action === "close") { $("body").fadeOut(); }
        });

        function searchCitizen() {
            const id = $("#search-id").val();
            $.post(`https://${GetParentResourceName()}/searchID`, JSON.stringify({ id: id }));
        }

        document.onkeyup = function(data) { if (data.which == 27) $.post(`https://${GetParentResourceName()}/close`); };
    </script>
</body>
</html>
